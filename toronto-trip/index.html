.body{flex:1;min-width:0}
.name{font-weight:700}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.note{font-size:14px;margin-top:6px}

.tag.q{color:#b7791f;background:#fff3cf}

.chk:last-child{border-bottom:0}
.chk.on span{text-decoration:line-through;opacity:.5}
.chk input{flex:0 0 auto;margin-top:1px}

const CAUTIONS=[
 'Brazil customs: US$1,000 purchase allowance by air, 12 L of alcohol. Confirm in the Receita Federal Guia do Viajante.',
 'Carry-on only: maple syrup and ice wine need a checked bag.',
 'Items marked "? unconfirmed" are ones I could not identify; check them on Maps before planning around them.'
];

const SURE={S:'',K:'',C:'? unconfirmed'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let view='day',day=null,cat='all';
let done={};try{done=JSON.parse(localStorage.getItem('tt-done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('tt-done',JSON.stringify(done))}catch(e){}};
const maps=i=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(i.n.split(':').pop().split('/')[0].trim()+' '+(i.a||'')+' Toronto');
const key=i=>i.d+'|'+i.n;
const dayLabel=d=>{const x=DAYS.find(y=>y[0]===d);return x?x[1]+' '+d+' Nov':'Ideas'};

function card(i,showDay){
  const k=key(i);
  const isShop=i.d===0;
  const links=[];
  if(i.b)links.push(`<a class="btn primary" href="${esc(i.b)}" target="_blank" rel="noopener">${esc(i.bl||'Book')}</a>`);
  if(i.u&&i.u!==i.b)links.push(`<a class="btn" href="${esc(i.u)}" target="_blank" rel="noopener">🌐 Website</a>`);
  if(!i.u&&!i.b)links.push(`<a class="btn ghost" href="https://www.google.com/search?q=${encodeURIComponent(i.n+' Toronto official site')}" target="_blank" rel="noopener">🔍 Find site</a>`);
  if(i.a!==''&&i.c!=='go'||i.d===0)links.push(`<a class="btn" href="${maps(i)}" target="_blank" rel="noopener">📍 Map</a>`);
  return `<div class="card cat-${i.c} ${done[k]?'done':''}"><div class="row">
   <div class="time">${showDay?esc(dayLabel(i.d).replace(' Nov','')):esc(i.t||'')}${showDay&&i.t?'<br>'+esc(i.t):''}</div>
   <div class="body"><div class="name">${CATS[i.c].split(' ')[0]} ${esc(i.n)}${i.b&&true?'<span class="tag book">book</span>':''}${SURE[i.s]?`<span class="tag q">${SURE[i.s]}</span>`:''}</div>
   <div class="meta">${esc([i.p,i.a].filter(Boolean).join(' · '))}</div>
   ${i.x?`<div class="note">${esc(i.x)}</div>`:''}
   <div class="links">${links.join('')}</div></div>
   <input type="checkbox" ${done[k]?'checked':''} data-k="${esc(k)}" aria-label="Done"></div></div>`;
}

function render(){
  const db=$('#daybar'),cb=$('#chipbar'),m=$('#main');
  db.style.display=view==='day'?'flex':'none';
  cb.style.display=view==='cat'?'flex':'none';
  if(view==='day'){
    db.innerHTML=DAYS.map(([d,w])=>`<button class="day ${d===day?'on':''}" data-d="${d}"><span>${w}</span><b>${d}</b></button>`).join('');
    const items=I.filter(i=>i.d===day);
    const warn=day===14?'<div class="warn">⚠ GO train times in the plan do not match the official Saturday timetable. Check before booking anything else for Niagara.</div>':day===9?'<div class="warn">No food stops while carrying bags. Nothing on Monday needs a ticket.</div>':day===10?'<div class="warn">Nothing ticketed today.</div>':'';
    m.innerHTML=`<div class="dayhead"><strong>${dayLabel(day)}</strong></div>${warn}`+items.map(i=>card(i)).join('');
  }else if(view==='cat'){
    cb.innerHTML=[['all','All'],...Object.entries(CATS)].map(([k,v])=>`<button class="chip ${k===cat?'on':''}" data-c="${k}">${v}</button>`).join('');
    const items=I.filter(i=>cat==='all'||i.c===cat);
    let out='',last=null;
    items.slice().sort((a,b)=>(a.d||99)-(b.d||99)).forEach(i=>{if(i.d!==last){out+=`<div class="group">${dayLabel(i.d)}</div>`;last=i.d}out+=card(i,false)});
    m.innerHTML=out||'<p class="sub">Nothing here.</p>';
  }else if(view==='check'){
    let tot=0,dn=0;
    CHECK.forEach(g=>g.i.forEach(t=>{tot++;if(done['chk|'+t])dn++;}));
    let out=`<div class="warn" id="prog">💗 ${dn} of ${tot} done. This list is general advice; confirm entry rules and allowances with the official sources.</div>`;
    CHECK.forEach(g=>{
      out+=`<div class="group">${g.g}</div><div class="card">`+g.i.map(t=>{const k='chk|'+t;return `<label class="chk ${done[k]?'on':''}"><input type="checkbox" ${done[k]?'checked':''} data-k="${esc(k)}" data-chk="1"><span>${esc(t)}</span></label>`}).join('')+`</div>`;
    });
    m.innerHTML=out;
  }else{
    let out=CAUTIONS.map(c=>`<div class="warn">${esc(c)}</div>`).join(''),last='';
    TOBOOK.forEach(b=>{
      if(b.w!==last){out+=`<div class="group">${b.w}</div>`;last=b.w}
      const k='book|'+b.n;
      const ls=[];
      if(b.u)ls.push(`<a class="btn primary" href="${esc(b.u)}" target="_blank" rel="noopener">${esc(b.l||'Open')}</a>`);
      if(b.u2)ls.push(`<a class="btn primary" href="${esc(b.u2)}" target="_blank" rel="noopener">${esc(b.l2)}</a>`);
      out+=`<div class="card ${done[k]?'done':''}"><div class="row"><div class="body"><div class="name">${esc(b.n)}</div><div class="note">${esc(b.x)}</div><div class="links">${ls.join('')}</div></div><input type="checkbox" ${done[k]?'checked':''} data-k="${esc(k)}" aria-label="Done"></div></div>`;
    });
    m.innerHTML=out;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-d],[data-c],nav button');
  if(!t)return;
  if(t.dataset.d){day=+t.dataset.d;render();window.scrollTo(0,0);}
  else if(t.dataset.c){cat=t.dataset.c;render();}
  else if(t.dataset.v){view=t.dataset.v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));render();window.scrollTo(0,0);}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(k===undefined)return;
  if(e.target.checked)done[k]=1;else delete done[k];save();if(e.target.dataset.chk){e.target.closest('.chk').classList.toggle('on',e.target.checked);render();}else e.target.closest('.card').classList.toggle('done',e.target.checked);
});
// start on today's trip day if within the trip, else the first day
const today=new Date();
day=(today.getFullYear()===2026&&today.getMonth()===10&&today.getDate()>=9&&today.getDate()<=19)?today.getDate():9;
render();
