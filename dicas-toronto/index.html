<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toronto da Paula</title>
<meta name="description" content="Dicas de viagem para Toronto e Niagara, baseadas em experiência real.">
<meta name="theme-color" content="#b4372b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toronto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#faf6f0; --card:#ffffff; --ink:#1f1c19; --muted:#6d665d; --line:#e9e1d4;
  --accent:#b4372b; --accent-soft:#f6e3df; --ok:#2f6f4f; --ok-soft:#e1efe7; --star:#e0a526;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151311; --card:#1f1c19; --ink:#f2ede6; --muted:#a8a095; --line:#34302b;
    --accent:#e2685a; --accent-soft:#3a2420; --ok:#6cc29a; --ok-soft:#1d3329; --star:#f0bd4a;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:16px}
header.top{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 4px}
header.top h1{font-size:1.6rem;margin:0;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
h2{font-size:1.15rem;margin:22px 0 10px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.card .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,var(--accent-soft),var(--bg))}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 14px 14px}
.card h3{margin:0;font-size:1.08rem;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;color:var(--muted);font-size:.85rem}
.stars{color:var(--star);letter-spacing:1px}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.no{background:#55555522;color:var(--muted)}
.op{margin:10px 0 0}
.box{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.92rem}
.box b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.box.dica{background:var(--ok-soft)} .box.dica b{color:var(--ok)}
.box.curio{background:var(--accent-soft)} .box.curio b{color:var(--accent)}
.box ul{margin:0;padding-left:18px}
.box.cupom{border:2px dashed var(--accent);text-align:center;font-weight:700}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.92rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.addr{font-size:.85rem;color:var(--muted);margin-top:8px}
.hero{background:var(--accent);color:#fff;border-radius:18px;padding:18px;margin-top:8px}
.hero p{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.tile span{font-size:1.6rem;display:block}
.tile b{display:block;margin-top:4px}
.tile small{color:var(--muted)}
.progress{margin-top:12px;font-size:.9rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.route{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.route h3{margin:0;font-size:1.05rem}
.route p{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.route ol{margin:0;padding-left:22px}
.route li{padding:4px 0}
.route li a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;box-shadow:var(--shadow)}
.list li{padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:none}
.list ul{padding-left:18px;margin:0}
.presto{font-family:ui-monospace,Menlo,monospace;font-size:1.1rem;font-weight:700;text-align:center;padding:12px;border-radius:12px;border:2px dashed var(--accent);margin:10px 0}
.note{font-size:.8rem;color:var(--muted);margin-top:16px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68rem;padding:4px 0}
nav.tabs a span{display:block;font-size:1.3rem;line-height:1.3}
nav.tabs a[aria-current=page]{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header class="top">
  <h1 id="titulo">Toronto</h1>
  <p id="subtitulo"></p>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="Seções">
  <a href="#inicio"><span>🍁</span>Início</a>
  <a href="#roteiros"><span>🗺️</span>Roteiros</a>
  <a href="#lugares"><span>📍</span>Lugares</a>
  <a href="#comida"><span>🍽️</span>Comida</a>
  <a href="#compras"><span>🛍️</span>Compras</a>
  <a href="#dicas"><span>💡</span>Dicas</a>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
