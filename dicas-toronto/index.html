<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toronto por Gab</title>
<meta name="description" content="Dicas de viagem para Toronto e Niagara, baseadas em experiência real.">
<meta name="theme-color" content="#fbe4e1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toronto por Gab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f3; --card:#ffffff; --ink:#4a3b3a; --muted:#8c7b78; --line:#f3e3dc;
  --maple:#e8807a; --maple-deep:#c9605a;
  --pink:#fde2e4; --mint:#d8f2e6; --lilac:#e8e1fa; --butter:#fff1c7; --sky:#dcecfb; --peach:#ffe3d1;
  --mint-ink:#3f8a6a; --star:#f2b84b;
  --shadow:0 2px 0 #f3e3dc, 0 8px 20px rgba(232,128,122,.10);
  --plaid:
    repeating-linear-gradient(90deg, rgba(232,128,122,.35) 0 14px, transparent 14px 28px),
    repeating-linear-gradient(0deg, rgba(232,128,122,.35) 0 14px, transparent 14px 28px),
    #fde2e4;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#2a2326; --card:#352c30; --ink:#f7ece8; --muted:#c3b1ac; --line:#463a3e;
    --maple:#f29b94; --maple-deep:#f6b3ad;
    --pink:#4a3438; --mint:#2f4640; --lilac:#3c3650; --butter:#4a4232; --sky:#2f3d4c; --peach:#4a3a33;
    --mint-ink:#9fdcc0; --star:#f6c76a; --shadow:none;
    --plaid:
      repeating-linear-gradient(90deg, rgba(242,155,148,.25) 0 14px, transparent 14px 28px),
      repeating-linear-gradient(0deg, rgba(242,155,148,.25) 0 14px, transparent 14px 28px),
      #4a3438;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
a{color:var(--maple-deep)}
main{max-width:640px;margin:0 auto;padding:4px 16px 16px}

/* Cabeçalho com faixa xadrez (lenhador canadense) */
.plaid{height:14px;background:var(--plaid)}
header.top{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;position:relative}
header.top h1{font-family:"Pacifico",cursive;font-weight:400;font-size:2rem;margin:0 0 10px;color:var(--maple-deep);line-height:1.5}
header.top h1 .leaf{display:inline-block;transform:rotate(-12deg);margin-left:4px}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
.deco{position:absolute;right:16px;top:calc(18px + env(safe-area-inset-top));font-size:1.3rem;opacity:.55;letter-spacing:6px}

h2{font-size:1.1rem;font-weight:800;margin:24px 0 10px}
.search{width:100%;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search:focus{outline:none;border-color:var(--maple)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 .9rem "Nunito",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pink);border-color:var(--maple);color:var(--maple-deep)}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.card .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:3.2rem;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph::after{content:"🍁";position:absolute;right:12px;bottom:8px;font-size:1rem;opacity:.35}
.c0{background:var(--pink)} .c1{background:var(--mint)} .c2{background:var(--lilac)} .c3{background:var(--butter)} .c4{background:var(--sky)} .c5{background:var(--peach)}
.card .body{padding:14px 16px 16px}
.card h3{margin:0;font-size:1.12rem;font-weight:800;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;color:var(--muted);font-size:.86rem}
.stars{color:var(--star);letter-spacing:1px}
.tag{font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--lilac);color:var(--ink)}
.tag.citypass{background:var(--sky)} .tag.gratis{background:var(--mint)} .tag.niagara{background:var(--butter)}
.tag.no{background:var(--line);color:var(--muted)}
.op{margin:10px 0 0}
.box{margin-top:10px;padding:10px 14px;border-radius:16px;font-size:.92rem}
.box b{display:block;font-size:.78rem;font-weight:800;margin-bottom:2px}
.box.dica{background:var(--mint)} .box.dica b{color:var(--mint-ink)}
.box.curio{background:var(--butter)} .box.curio b{color:var(--ink)}
.box ul{margin:0;padding-left:18px}
.box.cupom{background:var(--pink);border:2px dashed var(--maple);text-align:center;font-weight:800}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 .9rem "Nunito",sans-serif;text-decoration:none;cursor:pointer}
.btn[aria-pressed=true]{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.addr{font-size:.86rem;color:var(--muted);margin-top:8px}

.hero{background:var(--pink);border-radius:24px;padding:20px 18px;margin-top:10px;position:relative;overflow:hidden;border:2px solid var(--line)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--plaid)}
.hero p{margin:6px 0 0;font-weight:600}
.hero .sig{font-family:"Pacifico",cursive;color:var(--maple-deep);margin-top:8px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{border:2px solid var(--line);border-radius:22px;padding:16px 14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.tile span{font-size:1.7rem;display:block}
.tile b{display:block;margin-top:4px;font-weight:800}
.tile small{color:var(--muted)}

.route{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow);border-top-width:8px}
.route h3{margin:0;font-size:1.05rem;font-weight:800}
.route p{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.route ol{margin:0;padding-left:22px}
.route li{padding:4px 0}
.route li a{color:var(--ink);text-decoration:none;border-bottom:2px dotted var(--maple)}
.r0{border-top-color:#f6c3c0} .r1{border-top-color:#b9e6d1} .r2{border-top-color:#d6cbf5} .r3{border-top-color:#ffe39a} .r4{border-top-color:#bfdcf7} .r5{border-top-color:#ffcfae}

.list{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:6px 16px;box-shadow:var(--shadow)}
.list li{padding:8px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border:none}
.list ul{padding-left:18px;margin:0}
.presto{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;font-weight:700;text-align:center;padding:12px;border-radius:16px;background:var(--sky);border:2px dashed #8fb8e0;margin:10px 0}
.note{font-size:.8rem;color:var(--muted);margin-top:16px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:30px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:700;padding:4px 0;border-radius:14px}
nav.tabs a span{display:block;font-size:1.3rem;line-height:1.3}
nav.tabs a[aria-current=page]{color:var(--maple-deep);background:var(--pink)}
dialog.pop{border:2px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);padding:22px 20px 18px;max-width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.pop::backdrop{background:rgba(40,25,28,.55)}
dialog.pop h3{font-family:"Pacifico",cursive;font-weight:400;color:var(--maple-deep);margin:0 0 10px;font-size:1.3rem}
dialog.pop p{margin:0 0 10px;line-height:1.5}
dialog.pop .pedra{font-weight:800;letter-spacing:.08em;text-align:center;color:var(--maple-deep);margin:14px 0 4px}
dialog.pop .actions{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="plaid" aria-hidden="true"></div>
<header class="top">
  <div class="deco" aria-hidden="true">❄️🍁</div>
  <h1 id="titulo">Toronto por Gab</h1>
  <p id="subtitulo"></p>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="Seções">
  <a href="#inicio"><span>🍁</span>Início</a>
  <a href="#roteiros"><span>🗺️</span>Roteiros</a>
  <a href="#lugares"><span>📍</span>Lugares</a>
  <a href="#comida"><span>🍽️</span>Comida</a>
  <a href="#compras"><span>🛍️</span>Compras</a>
  <a href="#dicas"><span>💡</span>Dicas</a>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
